[package]
name = "cuemol-xtal"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
cuemol-core.workspace = true
cuemol-gfx.workspace = true
cuemol-molstr.workspace = true
cuemol-qsys.workspace = true
cuemol-surface.workspace = true
cuemol-symm.workspace = true
rustfft = "6"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = { version = "3", default-features = false }

[lib]
name = "cuemol_xtal"
path = "src/lib.rs"

[dev-dependencies]
flate2 = "1.1"
bzip2 = "0.6"
lzma-rs = "0.3"
