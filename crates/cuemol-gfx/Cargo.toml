[package]
name = "cuemol-gfx"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
cuemol-core.workspace = true
libloading.workspace = true

[lib]
name = "cuemol_gfx"
path = "src/lib.rs"

[build-dependencies]
cc = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
