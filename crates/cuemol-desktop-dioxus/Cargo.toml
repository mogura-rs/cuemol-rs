# Dioxus front end — a THIRD selectable desktop UI alongside egui (cuemol-desktop
# `native-gui`) and gpui (`gpui-gui`). It is deliberately NOT a member of the root
# workspace: gpui 0.2.2 (the only published version) hard-pins `cocoa =0.26.0`
# while every Dioxus needs `>=0.26.1`, and one workspace shares one Cargo.lock in
# which even non-activated optional deps must co-resolve. This crate therefore
# keeps its own lockfile and depends only on the gpui-free `cuemol-desktop-core`.
#
# Build/run it explicitly (it is excluded from `cargo build --workspace`):
#   cargo run --manifest-path crates/cuemol-desktop-dioxus/Cargo.toml -- file.pdb
[package]
name = "cuemol-desktop-dioxus"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Own workspace root so this package resolves independently of the parent
# workspace's gpui-pinned lockfile.
[workspace]

[dependencies]
# Shared GUI-agnostic logic + the wgpu offscreen renderer (behind `offscreen`).
cuemol-desktop-core = { path = "../cuemol-desktop-core", features = ["offscreen", "scripting"] }
# Domain types referenced directly by the viewport/camera code.
cuemol-core = { path = "../cuemol-core" }
cuemol-qsys = { path = "../cuemol-qsys" }
cuemol-render = { path = "../cuemol-render" }
# Dioxus 0.7 desktop (wry/tao webview). The 3D view is rendered offscreen with
# wgpu and composited as a PNG data-URI <img>.
dioxus = { version = "0.7", default-features = false, features = [
  "desktop",
  "macro",
  "html",
  "signals",
  "hooks",
  "launch",
] }
# Executor-agnostic async timer for the animation playback loop (use_future).
futures-timer = "3"

[dev-dependencies]
# Test-only: build a `.qsc` fixture (scene writer + PDB reader) for the surface-
# load test. Already in the tree transitively via cuemol-desktop-core.
cuemol-molstr = { path = "../cuemol-molstr" }

[lib]
name = "cuemol_desktop_dioxus"
path = "src/lib.rs"

[[bin]]
name = "cuemol-desktop-dioxus"
path = "src/main.rs"
