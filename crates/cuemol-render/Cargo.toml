[package]
name = "cuemol-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
cuemol-core.workspace = true
cuemol-gfx.workspace = true
cuemol-qsys.workspace = true
png = "0.17"

[lib]
name = "cuemol_render"
path = "src/lib.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
