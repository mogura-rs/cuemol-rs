[package]
name = "cuemol-command"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
scripting = ["cuemol-desktop-core/scripting"]

[dependencies]
cuemol-core.workspace = true
cuemol-gfx.workspace = true
cuemol-anim.workspace = true
cuemol-mdtools.workspace = true
cuemol-xtal.workspace = true
cuemol-desktop-core.workspace = true
cuemol-molstr.workspace = true
cuemol-qsys.workspace = true
cuemol-render.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"
shlex.workspace = true
regex.workspace = true
ryu-js = "1.0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cuemol-desktop-core = { workspace = true, features = ["text-rendering"] }
image = { version = "0.25", default-features = false, features = ["png"] }
semver = "1"
tiny_http = "0.12"
ureq = { version = "3.2", default-features = false, features = ["rustls", "json"] }
getrandom = "0.3"
tempfile = { version = "3", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[build-dependencies]
serde_json = "1"
toml = "1.1.2"
time = { version = "=0.3.51", features = ["formatting"] }

[dev-dependencies]
cuemol-lwview.workspace = true
