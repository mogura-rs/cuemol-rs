[package]
name = "cuemol-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
cuemol-core.workspace = true
cuemol-gfx.workspace = true
cuemol-qsys.workspace = true
cuemol-molstr.workspace = true
cuemol-mdtools.workspace = true
cuemol-molanl.workspace = true
cuemol-molvis.workspace = true
cuemol-surface.workspace = true
cuemol-anim.workspace = true
cuemol-render.workspace = true
cuemol-xtal.workspace = true
bytemuck = { version = "1.25", features = ["derive"], optional = true }
egui = { version = "0.33.3", optional = true }
egui-wgpu = { version = "0.33.3", optional = true }
egui-winit = { version = "0.33.3", default-features = false, optional = true }
glam = { version = "0.30.10", optional = true }
pollster = { version = "0.4", optional = true }
wgpu = { version = "27.0.1", optional = true }
winit = { version = "0.30.12", optional = true }

[features]
default = []
native-gui = [
  "dep:bytemuck",
  "dep:egui",
  "dep:egui-wgpu",
  "dep:egui-winit",
  "dep:glam",
  "dep:pollster",
  "dep:wgpu",
  "dep:winit",
]

[lib]
name = "cuemol_desktop"
path = "src/lib.rs"

[[bin]]
name = "cuemol-desktop"
path = "src/main.rs"
required-features = ["native-gui"]
