[package]
name = "cuemol-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
# GUI-agnostic shared logic (DesktopAppState facade, Gui* view-models, offscreen
# wgpu renderer). Re-exported at this crate's root for the egui and Tauri modules.
cuemol-desktop-core.workspace = true
cuemol-core.workspace = true
cuemol-gfx.workspace = true
cuemol-qsys.workspace = true
cuemol-molstr.workspace = true
cuemol-mdtools.workspace = true
cuemol-molanl.workspace = true
cuemol-molvis.workspace = true
cuemol-surface.workspace = true
cuemol-anim.workspace = true
cuemol-render.workspace = true
cuemol-xtal.workspace = true
bytemuck = { version = "1.25", features = ["derive"], optional = true }
ab_glyph = { version = "0.2.32", optional = true }
egui = { version = "0.33.3", optional = true }
egui-wgpu = { version = "0.33.3", optional = true }
# `accesskit` keeps egui-winit's `PlatformOutput` destructuring in sync with egui's
# struct when the egui_kittest dev-dep (AccessKit-based) unifies egui's accesskit
# feature into the test build; without it the two disagree on `accesskit_update`.
egui-winit = { version = "0.33.3", default-features = false, features = ["accesskit"], optional = true }
glam = { version = "0.30.10", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
epaint_default_fonts = { version = "0.33.3", optional = true }
pollster = { version = "0.4", optional = true }
rfd = { version = "0.16", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tauri = { version = "2.11.5", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
# cookie 0.18.1 still calls the pre-0.3.52 parsing API used by Tauri.
time = { version = "=0.3.51", optional = true }
wgpu = { version = "27.0.1", optional = true }
winit = { version = "0.30.12", optional = true }

[features]
default = []
egui-gui = [
  "cuemol-desktop-core/offscreen",
  "cuemol-desktop-core/scripting",
  "dep:ab_glyph",
  "dep:bytemuck",
  "dep:egui",
  "dep:egui-wgpu",
  "dep:egui-winit",
  "dep:epaint_default_fonts",
  "dep:glam",
  "dep:image",
  "dep:pollster",
  "dep:rfd",
  "dep:wgpu",
  "dep:winit",
]
# Tauri desktop shell: the webview draws the panels and the shared wgpu renderer
# supplies the molecular viewport as a PNG data URI.
tauri-gui = [
  "cuemol-desktop-core/offscreen",
  "cuemol-desktop-core/scripting",
  "dep:ab_glyph",
  "dep:epaint_default_fonts",
  "dep:image",
  "dep:serde",
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-dialog",
  "dep:time",
]

# Visual self-verification: render the egui shell to a PNG offscreen (wgpu/Metal),
# so the CueMol2 layout can be compared against the XUL spec without a window.
# Pinned to egui's exact minor (0.33.x) — a mismatch would drag a second egui copy
# into the tree and break `egui::Context` type identity. Only used by egui-gui tests.
[dev-dependencies]
egui_kittest = { version = "0.33.3", features = ["wgpu"] }

[build-dependencies]
tauri-build = { version = "2.6.3", optional = true }

[lib]
name = "cuemol_desktop"
path = "src/lib.rs"

[[bin]]
name = "cuemol-desktop"
path = "src/main.rs"
required-features = ["egui-gui"]

[[bin]]
name = "cuemol-desktop-tauri"
path = "src/tauri_main.rs"
required-features = ["tauri-gui"]
