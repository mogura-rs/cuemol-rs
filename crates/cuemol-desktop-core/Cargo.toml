[package]
name = "cuemol-desktop-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# GUI-agnostic desktop logic shared by the egui and Tauri front ends: the
# headless `DesktopAppState` facade, the `Gui*Summary` view-models, and the
# offscreen wgpu renderer. It deliberately depends on no windowing toolkit.

[dependencies]
cuemol-core.workspace = true
cuemol-importers.workspace = true
cuemol-gfx.workspace = true
cuemol-qsys.workspace = true
cuemol-molstr.workspace = true
cuemol-mdtools.workspace = true
cuemol-molanl.workspace = true
cuemol-molvis.workspace = true
cuemol-surface.workspace = true
cuemol-anim.workspace = true
cuemol-render.workspace = true
cuemol-xtal.workspace = true
cuemol-symm.workspace = true
cuemol-lwview.workspace = true
cuemol-molclient = { workspace = true, optional = true }
cuemol-py = { workspace = true, optional = true }
# Offscreen wgpu renderer deps — optional, behind the `offscreen` feature, so the
# default workspace build stays light and headless (no GPU stack compiled).
bytemuck = { version = "1.25", features = ["derive"], optional = true }
glam = { version = "0.30.10", optional = true }
naga = { version = "27", features = ["termcolor"], optional = true }
png = { version = "0.17", optional = true }
pollster = { version = "0.4", optional = true }
wgpu = { version = "27.0.1", optional = true }
# Real (pure-Rust) JavaScript engine for Tools → Execute script — optional, behind
# the `scripting` feature, so the default headless build doesn't pull it.
boa_engine = { version = "0.20", optional = true }

[features]
default = []
# Embed the boa JS engine so Execute-script actually runs JavaScript (with a `cuemol`
# binding) instead of only previewing the file. Front ends enable this.
scripting = ["dep:boa_engine", "dep:cuemol-molclient", "dep:cuemol-py"]
# Compile the wgpu offscreen mesh renderer (`offscreen` module) and the
# `DesktopAppState::export_active_scene_png` path. Front ends that show a 3D view
# enable this; a pure scene-state build does not.
offscreen = [
  "dep:bytemuck",
  "dep:glam",
  "dep:naga",
  "dep:png",
  "dep:pollster",
  "dep:wgpu",
]

[lib]
name = "cuemol_desktop_core"
path = "src/lib.rs"
