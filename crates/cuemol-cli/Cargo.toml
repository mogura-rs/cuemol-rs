[package]
name = "cuemol-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
gui = ["dep:cuemol-desktop", "cuemol-desktop/egui-gui", "scripting"]
scripting = ["cuemol-command/scripting"]

[dependencies]
cuemol-command.workspace = true
cuemol-desktop-core.workspace = true
serde_json = "1"
cuemol-desktop = { workspace = true, optional = true }
cuemol-core.workspace = true
cuemol-gfx.workspace = true
cuemol-lwview.workspace = true
cuemol-mdtools.workspace = true
cuemol-molstr.workspace = true
cuemol-molvis.workspace = true
cuemol-qsys.workspace = true
cuemol-render.workspace = true
cuemol-surface.workspace = true
cuemol-symm.workspace = true
cuemol-xtal.workspace = true

[[bin]]
name = "cuemol"
path = "src/main.rs"
