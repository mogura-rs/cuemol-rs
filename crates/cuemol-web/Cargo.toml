[package]
name = "cuemol-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
cuemol-ui = { workspace = true, features = ["egui"] }
cuemol-core.workspace = true
cuemol-agent.workspace = true
cuemol-gfx.workspace = true
cuemol-desktop-core = { workspace = true, features = ["offscreen"] }
cuemol-command = { workspace = true, features = ["scripting"] }
boa_engine = { version = "0.20", features = ["js"] }
cuemol-mdtools.workspace = true
cuemol-molstr.workspace = true
cuemol-qsys.workspace = true
cuemol-render.workspace = true
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "wgpu"] }
wgpu = { version = "27.0.1", features = ["webgpu", "webgl"] }
glam = "0.30.10"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "HtmlInputElement", "HtmlAnchorElement", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "Storage", "Response", "console"] }
serde_json = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
base64 = "0.22"
