[package]
name = "cuemol-surface"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
cuemol-core.workspace = true
cuemol-gfx.workspace = true
cuemol-molstr.workspace = true
cuemol-qsys.workspace = true
lyon.workspace = true

[lib]
name = "cuemol_surface"
path = "src/lib.rs"

[build-dependencies]
cc = { version = "1", features = ["parallel"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
