[package]
name = "cuemol-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
cuemol-render.workspace = true
cuemol-agent = { workspace = true, optional = true }
cuemol-command = { workspace = true, optional = true }
cuemol-desktop-core = { workspace = true, optional = true }
cuemol-qsys = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
zeroize = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
egui-phosphor = { version = "0.11", optional = true }
egui = { version = "0.33.3", optional = true }

[features]
default = []
egui = ["cuemol-command/scripting", "dep:egui-phosphor", "dep:egui", "dep:cuemol-agent", "dep:cuemol-command", "dep:cuemol-desktop-core", "dep:cuemol-qsys", "dep:serde_json", "dep:base64", "dep:zeroize", "dep:image"]
