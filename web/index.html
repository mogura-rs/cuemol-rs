<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CueMol3</title><link rel="icon" href="data:,">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d17;color:#e7edf7;font:16px system-ui}canvas{width:100%;height:100%;display:block}#loading{position:fixed;inset:0;display:grid;place-items:center;white-space:pre-wrap;padding:2rem}input{display:none}</style></head>
<body><canvas id="viewport" aria-label="CueMol3 molecular viewer"></canvas><div id="loading">Loading CueMol3…</div><input id="files" type="file" multiple>
<script type="module">
import init, {start, open_file, command, status} from './pkg/cuemol_web.js';
import {initKernels} from './kernels.js';
import './oidn.js';
const loading=document.getElementById('loading');
try {
  await Promise.all([init(), initKernels()]);
  document.addEventListener('dragover',e=>{e.preventDefault();e.stopImmediatePropagation();},true);
  document.addEventListener('drop',e=>{e.preventDefault();e.stopImmediatePropagation();for(const file of e.dataTransfer.files)open_file(file);},true);
  let webgpu=false;
  const forceWebGL=new URLSearchParams(location.search).get('renderer')==='webgl';
  if(navigator.gpu && !forceWebGL) {
    try { const adapter=await navigator.gpu.requestAdapter(); if(adapter){const device=await adapter.requestDevice();await device.queue.onSubmittedWorkDone();device.destroy();webgpu=true;} }
    catch(error) { console.warn('WebGPU is unavailable; using WebGL2.',error); }
  }
  await start(document.getElementById('viewport'),!webgpu); loading.remove();
  window.cuemol={backend:webgpu?'webgpu':'webgl',command:(name,args={})=>command(name,JSON.stringify(args)),status:()=>JSON.parse(status())};
  document.getElementById('files').onchange=e=>{for(const file of e.target.files)open_file(file);e.target.value='';};
} catch(error) { loading.textContent='CueMol3 could not start. Use a browser with WebGPU or WebGL2 enabled.\n'+error; console.error(error); }
</script></body></html>
