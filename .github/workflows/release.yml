name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish when running against a version tag
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          elif [ "$PUBLISH" = true ]; then
            echo "Select a version tag to publish a release." >&2
            exit 1
          fi
  test:
    needs: validate
    uses: ./.github/workflows/test.yml
  web:
    needs: validate
    uses: ./.github/workflows/web.yml
  build:
    needs: [test, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: scripts/tool-requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: .cache/web-artifact
      - uses: actions/cache@v6
        id: tools
        with:
          path: .cache/bundled-tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('scripts/bundle-tools.py', 'scripts/bundle-oidn.py', 'scripts/bundle-povray.py', 'scripts/tool-requirements.txt') }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libsuitesparse-dev libopenblas-dev gfortran autoconf automake libboost-thread-dev libpng-dev libjpeg-dev libtiff-dev patchelf
      - name: Install macOS source-build dependencies
        if: runner.os == 'macOS' && steps.tools.outputs.cache-hit != 'true'
        run: brew install suite-sparse openblas gettext libiconv libomp
      - name: Install macOS POV-Ray build dependencies
        if: runner.os == 'macOS' && steps.tools.outputs.cache-hit != 'true'
        run: brew install autoconf automake boost libpng jpeg-turbo libtiff
      - name: Build native tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: uv run --no-project python scripts/bundle-tools.py
      - name: Verify browser artifact
        shell: bash
        run: uv run --no-project python scripts/prepare-web-dist.py --verify .cache/web-artifact --revision "$GITHUB_SHA"
      - name: Build application with browser assets
        env:
          CUEMOL_WEB_DIR: ${{ github.workspace }}/.cache/web-artifact
          CUEMOL_RELEASE_REPOSITORY: ${{ github.repository }}
          CUEMOL_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: cargo build --locked --release -p cuemol-cli --features gui,bundled-web --target ${{ matrix.target }}
      - name: Verify command-line entry points
        shell: bash
        env:
          CUEMOL_CONFIG_DIR: ${{ runner.temp }}/cuemol-config
          CUEMOL_TOOLS_DIR: ${{ github.workspace }}/.cache/bundled-tools
          TARGET: ${{ matrix.target }}
        run: |
          extension=""
          if [ "$RUNNER_OS" = Windows ]; then extension=.exe; fi
          binary="target/$TARGET/release/cuemol$extension"
          "$binary" --version
          "$binary" mcp tools > .cache/native-tools.json
          uv run --no-project python scripts/check-apbs.py --binary "$binary"
          "$binary" tools run pdb2pqr --version
          "$binary" tools run ffmpeg -version
          uv run --no-project python scripts/check-povray.py --binary "$binary"
      - name: Test Unix installer and self-upgrade
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/test-install.sh "target/$TARGET/release/cuemol"
      - name: Test Windows installer and self-upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-install.ps1 -Binary target/${{ matrix.target }}/release/cuemol.exe
      - name: Package distributions
        run: uv run --no-project python scripts/package-release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: release-diagnostics-${{ matrix.target }}
          path: |
            .cache/tools/apbs-build/CMakeFiles/CMakeConfigureLog.yaml
            .cache/tools/apbs-build/CMakeFiles/CMakeError.log
            .cache/tools/apbs-build/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: .cache/web-artifact
      - name: Verify complete distribution matrix
        run: uv run --no-project python scripts/prepare-release.py --web .cache/web-artifact --revision "$GITHUB_SHA"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/publish-release.sh dist
