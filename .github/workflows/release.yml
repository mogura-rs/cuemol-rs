name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    uses: ./.github/workflows/web.yml
  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: scripts/tool-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: web
      - uses: actions/cache@v4
        id: tools
        with:
          path: .cache/bundled-tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('scripts/bundle-tools.py', 'scripts/bundle-oidn.py', 'scripts/tool-requirements.txt') }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libsuitesparse-dev libopenblas-dev gfortran
      - name: Install macOS source-build dependencies
        if: runner.os == 'macOS' && runner.arch == 'ARM64' && steps.tools.outputs.cache-hit != 'true'
        run: brew install suite-sparse openblas gettext libiconv libomp
      - name: Build native tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: uv run --no-project python scripts/bundle-tools.py
      - name: Build application with browser assets
        env:
          CUEMOL_RELEASE_REPOSITORY: ${{ github.repository }}
          CUEMOL_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: cargo build --locked --release -p cuemol-cli --features gui,bundled-web --target ${{ matrix.target }}
      - name: Verify command-line entry points
        shell: bash
        env:
          CUEMOL_CONFIG_DIR: ${{ runner.temp }}/cuemol-config
          CUEMOL_TOOLS_DIR: ${{ github.workspace }}/.cache/bundled-tools
          TARGET: ${{ matrix.target }}
        run: |
          extension=""
          if [ "$RUNNER_OS" = Windows ]; then extension=.exe; fi
          binary="target/$TARGET/release/cuemol$extension"
          "$binary" --version
          "$binary" mcp tools > .cache/native-tools.json
          "$binary" tools run pdb2pqr --version
          "$binary" tools run ffmpeg -version
      - name: Test Windows installer and self-upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-install.ps1 -Binary target/${{ matrix.target }}/release/cuemol.exe
      - name: Package distributions
        run: uv run --no-project python scripts/package-release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: web
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd web && zip -q -r ../dist/cuemol-web.zip .)
          cd dist
          sha256sum * > SHA256SUMS
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${args[@]}" ./*
