name: Web build
on:
  workflow_call:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/cache@v6
        with:
          path: .cache/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('scripts/build-web-kernels.py') }}
      - uses: actions/cache@v6
        with:
          path: |
            .cache/web-tools
            .cache/web-kernels
            .cache/oidn-packages
          key: web-tools-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'scripts/prepare-web-tools.py', 'scripts/build-web-kernels.py', 'scripts/bundle-oidn.py', 'crates/cuemol-molanl/vendor/**', 'crates/cuemol-gfx/vendor/**', 'crates/cuemol-surface/vendor/**') }}
      - uses: actions/cache@v6
        with:
          path: .cache/ui-fonts
          key: ui-fonts-${{ runner.os }}-${{ hashFiles('scripts/bundle-ui-fonts.py') }}
      - uses: actions/cache@v6
        with:
          path: .cache/browser-movie
          key: browser-movie-${{ runner.os }}-${{ hashFiles('scripts/bundle-movie.py') }}
      - name: Prepare wasm-bindgen
        run: uv run --no-project python scripts/prepare-web-tools.py
      - name: Build browser application
        run: cargo run --locked -p cuemol-cli -- web build
      - name: Stage portable browser assets
        run: uv run --no-project python scripts/prepare-web-dist.py --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: web-assets
          path: dist/web/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: web-test-server
          path: target/debug/cuemol
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
