name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: core-tests
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: .cache/bundled-tools/oidn
          key: oidn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bundle-oidn.py') }}
        id: oidn
      - name: Prepare OIDN runtime
        if: steps.oidn.outputs.cache-hit != 'true'
        run: uv run --no-project python scripts/bundle-oidn.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test shared core and CLI
        run: cargo test --locked --workspace --exclude cuemol-desktop --exclude cuemol-web
      - name: Test installer and self-upgrade
        run: |
          cargo build --locked -p cuemol-cli
          scripts/test-install.sh target/debug/cuemol
  web:
    uses: ./.github/workflows/web.yml
