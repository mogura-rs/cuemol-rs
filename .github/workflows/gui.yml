name: Published native GUI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to validate (empty selects latest)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libegl1 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers xvfb xauth xdotool xclip gnome-keyring dbus-x11
      - name: Download and verify published application
        id: distribution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          suffix=tar.gz
          if [ "$RUNNER_OS" = Windows ]; then suffix=zip; fi
          tag_args=()
          if [ -n "$RELEASE_TAG" ]; then tag_args+=("$RELEASE_TAG"); fi
          patterns=(--pattern "cuemol-$TARGET.$suffix" --pattern SHA256SUMS)
          if [ "$RUNNER_OS" = macOS ]; then patterns+=(--pattern "cuemol-rs-$TARGET.zip"); fi
          gh release download "${tag_args[@]}" "${patterns[@]}" --dir .cache/gui-release
          uv run --no-project --python 3.13 python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import subprocess
          import tarfile
          import zipfile
          work = Path('.cache/gui-release')
          suffix = 'zip' if os.environ['RUNNER_OS'] == 'Windows' else 'tar.gz'
          name = f"cuemol-{os.environ['TARGET']}.{suffix}"
          archive = work / name
          checksums = dict(line.split(maxsplit=1)[::-1] for line in (work / 'SHA256SUMS').read_text().splitlines() if line.strip())
          with archive.open('rb') as source:
              actual = hashlib.file_digest(source, 'sha256').hexdigest()
          if actual != checksums[name]:
              raise RuntimeError('Published archive checksum mismatch')
          output = work / 'app'
          if suffix == 'zip':
              with zipfile.ZipFile(archive) as package:
                  package.extractall(output)
          else:
              with tarfile.open(archive) as package:
                  package.extractall(output, filter='data')
          info = json.loads((output / 'build-info.json').read_text())
          if info['target'] != os.environ['TARGET']:
              raise RuntimeError('Published archive target mismatch')
          if os.environ['RELEASE_TAG'] and info['version'] != os.environ['RELEASE_TAG']:
              raise RuntimeError('Published archive version mismatch')
          info.update(archive=name, archiveSha256=actual)
          if os.environ['RUNNER_OS'] == 'macOS':
              app_name = f"cuemol-rs-{os.environ['TARGET']}.zip"
              app_archive = work / app_name
              with app_archive.open('rb') as source:
                  app_hash = hashlib.file_digest(source, 'sha256').hexdigest()
              if app_hash != checksums[app_name]:
                  raise RuntimeError('Published application checksum mismatch')
              subprocess.run(['ditto', '-x', '-k', str(app_archive), str(output)], check=True)
              contents = output / 'cuemol-rs.app/Contents'
              app_info = json.loads((contents / 'Resources/build-info.json').read_text())
              for key in ('commit', 'version', 'target'):
                  if app_info[key] != info[key]:
                      raise RuntimeError(f'Application metadata mismatch: {key}')
              plist = plistlib.loads((contents / 'Info.plist').read_bytes())
              if plist['CFBundleExecutable'] != 'cuemol-rs' or plist['CFBundleShortVersionString'] != info['version'].removeprefix('v'):
                  raise RuntimeError('Application bundle metadata mismatch')
              with (output / 'cuemol').open('rb') as source:
                  native_hash = hashlib.file_digest(source, 'sha256').hexdigest()
              with (contents / 'MacOS/cuemol-rs').open('rb') as source:
                  if hashlib.file_digest(source, 'sha256').hexdigest() != native_hash:
                      raise RuntimeError('Application and command-line executables differ')
              info.update(appArchive=app_name, appArchiveSha256=app_hash,
                          binarySha256=native_hash)
          evidence = Path('.cache/native-gui-check')
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / 'distribution.json').write_text(json.dumps(info, indent=2) + '\n')
          print(f'Verified {name}: {actual}')
          PY
      - name: Check presented pixels and OS input
        shell: bash
        run: |
          extension=''
          if [ "$RUNNER_OS" = Windows ]; then extension=.exe; fi
          binary=".cache/gui-release/app/cuemol$extension"
          if [ "$RUNNER_OS" = macOS ]; then binary='.cache/gui-release/app/cuemol-rs.app/Contents/MacOS/cuemol-rs'; fi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1440x1080x24' uv run --python 3.13 scripts/check-native-gui.py --binary "$binary" --out .cache/native-gui-check
          else
            uv run --python 3.13 scripts/check-native-gui.py --binary "$binary" --out .cache/native-gui-check
          fi
      - name: Check native credential storage with a loopback provider
        if: ${{ !cancelled() && steps.distribution.outcome == 'success' }}
        shell: bash
        env:
          CUEMOL_CREDENTIAL_TEST_RUNNER: ${{ runner.environment }}
        run: |
          extension=''
          if [ "$RUNNER_OS" = Windows ]; then extension=.exe; fi
          binary=".cache/gui-release/app/cuemol$extension"
          if [ "$RUNNER_OS" = macOS ]; then binary='.cache/gui-release/app/cuemol-rs.app/Contents/MacOS/cuemol-rs'; fi
          if [ "$RUNNER_OS" = Linux ]; then
            export XDG_DATA_HOME="$RUNNER_TEMP/cuemol-keyring-data"
            export XDG_CONFIG_HOME="$RUNNER_TEMP/cuemol-keyring-config"
            dbus-run-session -- bash -c '
              printf "validation-store-password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
              uv run --no-project python scripts/check-agent-credentials.py --binary "$1" --out .cache/native-gui-check/credentials.json
            ' _ "$binary"
          else
            uv run --no-project python scripts/check-agent-credentials.py --binary "$binary" --out .cache/native-gui-check/credentials.json
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gui-${{ matrix.target }}
          path: .cache/native-gui-check
          if-no-files-found: error
          retention-days: 7
