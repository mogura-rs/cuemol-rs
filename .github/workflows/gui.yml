name: Published native GUI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to validate
        required: true
        default: v0.1.1
permissions:
  contents: read
jobs:
  gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libgl1-mesa-dri xvfb xauth xdotool
      - name: Download and verify published application
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          suffix=tar.gz
          if [ "$RUNNER_OS" = Windows ]; then suffix=zip; fi
          gh release download "$RELEASE_TAG" --pattern "cuemol-$TARGET.$suffix" --pattern SHA256SUMS --dir .cache/gui-release
          uv run --no-project --python 3.13 python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import tarfile
          import zipfile
          work = Path('.cache/gui-release')
          suffix = 'zip' if os.environ['RUNNER_OS'] == 'Windows' else 'tar.gz'
          name = f"cuemol-{os.environ['TARGET']}.{suffix}"
          archive = work / name
          checksums = dict(line.split(maxsplit=1)[::-1] for line in (work / 'SHA256SUMS').read_text().splitlines() if line.strip())
          with archive.open('rb') as source:
              actual = hashlib.file_digest(source, 'sha256').hexdigest()
          if actual != checksums[name]:
              raise RuntimeError('Published archive checksum mismatch')
          output = work / 'app'
          if suffix == 'zip':
              with zipfile.ZipFile(archive) as package:
                  package.extractall(output)
          else:
              with tarfile.open(archive) as package:
                  package.extractall(output, filter='data')
          print(f'Verified {name}: {actual}')
          PY
      - name: Check presented pixels and OS input
        shell: bash
        run: |
          extension=''
          if [ "$RUNNER_OS" = Windows ]; then extension=.exe; fi
          binary=".cache/gui-release/app/cuemol$extension"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1440x1080x24' uv run --python 3.13 scripts/check-native-gui.py --binary "$binary" --out .cache/native-gui-check
          else
            uv run --python 3.13 scripts/check-native-gui.py --binary "$binary" --out .cache/native-gui-check
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gui-${{ matrix.target }}
          path: .cache/native-gui-check
          if-no-files-found: error
          retention-days: 7
